<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#5a1db8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Metro track -->
    <rect x="-160" y="-80" width="320" height="16" rx="8" fill="#ffffff" opacity="0.25"/>
    <rect x="-160" y="20" width="320" height="16" rx="8" fill="#ffffff" opacity="0.25"/>
    <!-- Vending machine body -->
    <rect x="-90" y="-55" width="180" height="110" rx="14" fill="#ffffff"/>
    <!-- Screen -->
    <rect x="-70" y="-42" width="140" height="55" rx="8" fill="#1a1a2e"/>
    <!-- Screen content - pad icon -->
    <rect x="-30" y="-28" width="60" height="36" rx="6" fill="#9d5cfa" opacity="0.9"/>
    <circle cx="0" cy="-10" r="6" fill="#ffffff"/>
    <rect x="-20" y="-4" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
    <!-- Dispensing slot -->
    <rect x="-45" y="25" width="90" height="12" rx="6" fill="#e5e7eb"/>
    <!-- Status light -->
    <circle cx="-65" cy="42" r="5" fill="#22c55e"/>
    <circle cx="-55" cy="42" r="5" fill="#f59e0b" opacity="0.5"/>
    <!-- Care cross -->
    <g transform="translate(70, -35)">
      <rect x="-3" y="-10" width="6" height="20" rx="3" fill="#ef4444"/>
      <rect x="-10" y="-3" width="20" height="6" rx="3" fill="#ef4444"/>
    </g>
  </g>
</svg>