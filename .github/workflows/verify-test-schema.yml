name: Verify Test Schema

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Verify backend-test reads test schema
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== backend-test env DATABASE_URL (tail) ==="
            pm2 env 1 >/dev/null 2>&1 || true
            PM2_PID=$(pm2 pid backend-test)
            echo "pid=$PM2_PID"
            tr '\0' '\n' < /proc/$PM2_PID/environ 2>/dev/null | grep '^DATABASE_URL=' | sed -E 's/(password=)[^@]*/\1***/' | cut -c1-120
            echo "=== query search_path through app? try health ==="
            curl -s http://127.0.0.1:5001/api/health || echo "health failed"
            echo ""
            echo "=== compare counts: test vs public via direct psql-like helper ==="
            cd /home/ec2-user/app/backend
            TEST_DB_URL=$(grep '^TEST_DATABASE_URL=' .env | head -1 | cut -d= -f2-)
            node --input-type=module -e "
              import pg from 'pg';
              const url = process.env.TEST_DB_URL;
              const c = new pg.Client({ connectionString: url, ssl: { rejectUnauthorized: false } });
              await c.connect();
              const r = await c.query('SELECT current_schema(), (SELECT count(*) FROM receipts) AS receipts, (SELECT count(*) FROM users) AS users');
              console.log(JSON.stringify(r.rows[0]));
              await c.end();
            " TEST_DB_URL="$TEST_DB_URL"
