name: Deploy Vercel (path-filtered)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'others/client-web/**'
      - 'others/admin-attendance/**'
      - 'others/hr form/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client-web: ${{ steps.filter.outputs.client-web }}
      admin-attendance: ${{ steps.filter.outputs.admin-attendance }}
      hr-form: ${{ steps.filter.outputs.hr-form }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client-web: 'others/client-web/**'
            admin-attendance: 'others/admin-attendance/**'
            hr-form: 'others/hr form/**'

  deploy-client-web:
    needs: changes
    if: needs.changes.outputs.client-web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CLIENT_WEB }}
          vercel-args: '--prod --yes'
          working-directory: others/client-web

  deploy-admin-attendance:
    needs: changes
    if: needs.changes.outputs.admin-attendance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_ATTENDANCE }}
          vercel-args: '--prod --yes'
          working-directory: others/admin-attendance

  deploy-hr-form:
    needs: changes
    if: needs.changes.outputs.hr-form == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_HR_FORM }}
          vercel-args: '--prod --yes'
          working-directory: others/hr form
