name: UCS CRM - Monthly Restore Test

on:
  schedule:
    # Run on 1st of every month at 04:00 UTC (after backup window)
    - cron: '0 4 1 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  id-token: write

jobs:
  restore-test-aws-backup:
    name: Restore Test - AWS Backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-south-1
      AWS_ROLE_ARN: ${{ secrets.AWS_RESTORE_TEST_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: cd backend && npm ci
        working-directory: backend

      - name: Run Restore Test (AWS Backup)
        run: node scripts/backup/restore-test.mjs aws-backup
        working-directory: backend
        env:
          AWS_REGION: ap-south-1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-test-results
          path: |
            /tmp/ucs-crm-restore-*.log
          retention-days: 30

  restore-test-s3-dump:
    name: Restore Test - S3 Dump
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-south-1
      AWS_ROLE_ARN: ${{ secrets.AWS_RESTORE_TEST_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: cd backend && npm ci
        working-directory: backend

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Restore Test (S3 Dump)
        run: node scripts/backup/restore-test.mjs s3-dump
        working-directory: backend
        env:
          AWS_REGION: ap-south-1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-test-s3-dump-results
          path: |
            /tmp/ucs-crm-restore-*.log
          retention-days: 30

  notify:
    name: Notify Results
    needs: [restore-test-aws-backup, restore-test-s3-dump]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Test Results
        id: check
        run: |
          if ${{ needs.restore-test-aws-backup.result == 'success' && needs.restore-test-s3-dump.result == 'success' }}; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ All restore tests passed" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Restore test failed - check workflow logs" >> $GITHUB_OUTPUT
          fi

      - name: Send SNS Notification
        if: env.AWS_SNS_TOPIC_ARN != ''
        run: |
          aws sns publish \
            --topic-arn ${{ env.AWS_SNS_TOPIC_ARN }} \
            --subject "UCS CRM Restore Test: ${{ steps.check.outputs.status }}" \
            --message "${{ steps.check.outputs.message }}"