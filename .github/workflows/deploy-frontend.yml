name: Deploy Frontend (client)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'client/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'client/package-lock.json'

      - name: Build
        env:
          VITE_API_URL: https://api.beingsevak.org/api
          VITE_SOCKET_URL: https://api.beingsevak.org
          VITE_WHATSAPP_MASTER_EMAIL: ${{ secrets.CRM_WHATSAPP_EMAIL }}
          VITE_WHATSAPP_MASTER_PASSWORD: ${{ secrets.CRM_WHATSAPP_PASSWORD }}
        run: |
          cd client
          npm ci
          npm run build

      - name: Clear old entry point (keep hashed assets for open tabs)
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo -n chown -R ec2-user:ec2-user /var/www/crm 2>/dev/null || true
            # NOTE: never rm -rf assets/ — hashed chunk filenames change every
            # build, and open tabs still request the previous deploy's chunks
            # ("Failed to fetch dynamically imported module"). Overwriting adds
            # the new files alongside the old ones; only prune files untouched
            # for 7+ days to bound disk growth.
            rm -f /var/www/crm/index.html || true
            find /var/www/crm/assets /var/www/crm/logo /var/www/crm/receipt-assets -type f -mtime +7 -delete 2>/dev/null || true

      - name: Deploy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "client/dist/*"
          target: /var/www/crm
          strip_components: 2

      - name: Verify Frontend
        run: |
          STATUS=$(curl -sf "https://crm.beingsevak.org" -o /dev/null -w "%{http_code}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Frontend is live (HTTP $STATUS)"
          else
            echo "Warning: Frontend returned HTTP $STATUS"
          fi
