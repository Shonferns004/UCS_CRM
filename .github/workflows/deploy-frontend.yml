name: Deploy Frontend (ucs crm)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'ucs crm/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'ucs crm/package-lock.json'

      - name: Build
        env:
          VITE_API_URL: https://api.beingsevak.org/api
          VITE_SOCKET_URL: https://api.beingsevak.org
          VITE_WHATSAPP_MASTER_EMAIL: ${{ secrets.CRM_WHATSAPP_EMAIL }}
          VITE_WHATSAPP_MASTER_PASSWORD: ${{ secrets.CRM_WHATSAPP_PASSWORD }}
        run: |
          cd "ucs crm"
          npm ci
          npm run build

      - name: Deploy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "ucs crm/dist/*"
          target: /var/www/crm
          strip_components: 2

      - name: Verify Frontend
        run: |
          STATUS=$(curl -sf "https://beingsevak.org" -o /dev/null -w "%{http_code}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Frontend is live (HTTP $STATUS)"
          else
            echo "Warning: Frontend returned HTTP $STATUS"
          fi
