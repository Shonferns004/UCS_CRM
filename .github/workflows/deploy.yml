name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ec2-user/app

            # Save current commit hash for rollback
            PREVIOUS_COMMIT=$(git rev-parse HEAD)

            git remote set-url origin https://github.com/priyankshahdev-alt/UCS_CRM.git
            git fetch origin
            git reset --hard origin/master
            if git diff HEAD@{1} --name-only 2>/dev/null | grep -qE 'backend/(package.json|package-lock.json)'; then
              cd backend && npm ci && cd ..
            fi

            # Sanity check: fail loudly rather than restart a backend whose
            # node_modules is broken (boot would crash on ERR_MODULE_NOT_FOUND).
            cd backend
            node -e "require('@aws-sdk/client-s3'); require('pg')" || { echo "ERROR: node_modules broken (missing required modules)"; exit 1; }
            cd ..

            pm2 restart backend --update-env

            # Save commit for potential rollback
            echo "$PREVIOUS_COMMIT" > /home/ec2-user/app/.previous-commit

      - name: Wait for backend to start
        run: sleep 10

      - name: Health Check
        id: healthcheck
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf "https://api.beingsevak.org/api/health" || echo "FAIL")
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "Production backend is healthy"
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Production health check failed after 5 attempts"
          echo "healthy=false" >> $GITHUB_OUTPUT
          exit 1

      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            PREVIOUS_COMMIT=$(cat /home/ec2-user/app/.previous-commit 2>/dev/null)
            if [ -n "$PREVIOUS_COMMIT" ]; then
              echo "Rolling back to $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"
              cd backend && npm ci && cd ..
              pm2 restart backend --update-env
              echo "Rollback complete"
            else
              echo "No previous commit found for rollback"
              pm2 restart backend --update-env
            fi
