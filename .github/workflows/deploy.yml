name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'

# Serialize with Deploy Test Backend: both SSH into the same EC2 dir and touch
# node_modules / pm2, so running them concurrently corrupts the install.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            git remote set-url origin https://github.com/priyankshahdev-alt/UCS_CRM.git
            git fetch origin
            git reset --hard origin/master
            if git diff HEAD@{1} --name-only | grep -qE 'backend/(package.json|package-lock.json)'; then
              cd backend && npm ci && cd ..
            fi

            # Sanity check: fail loudly rather than restart a backend whose
            # node_modules is broken (boot would crash on ERR_MODULE_NOT_FOUND).
            cd backend
            node -e "require('@aws-sdk/client-s3'); require('pg')" || { echo "ERROR: node_modules broken (missing required modules)"; exit 1; }
            cd ..

            pm2 restart backend --update-env

            # ── Cleanup: remove test infrastructure ──
            pm2 delete backend-test 2>/dev/null || true
            pm2 save
            sudo rm -rf /var/www/crm-test
            sudo cp /etc/caddy/Caddyfile /tmp/Caddyfile.bak
            sudo sed -i '/# --- BEGIN test-api.beingsevak.org ---/,/# --- END test-api.beingsevak.org ---/d' /etc/caddy/Caddyfile
            sudo sed -i '/# --- BEGIN test-crm.beingsevak.org ---/,/# --- END test-crm.beingsevak.org ---/d' /etc/caddy/Caddyfile
            sudo caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy || echo "Caddy cleanup skipped"
            echo "TEST INFRASTRUCTURE REMOVED"
