name: Inspect FRO Timer (read-only)

# Manual, one-shot diagnostics for the 4-minute disposition timer. READ-ONLY: it
# runs scripts/inspect-fro-worker.mjs, which only issues SELECTs, and it touches
# nothing the deploy pipeline owns.
#
#   gh workflow run inspect-fro-timer.yml \
#     -f worker="Mahima Redkar" -f ref=master
#
# Delete this file once the timer work is finished.
on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker name or login id to inspect'
        required: true
        default: 'Mahima Redkar'
      ref:
        description: 'Branch to run the scripts from'
        required: false
        default: 'master'

concurrency:
  group: inspect-fro-timer
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fetch the script
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: backend/scripts
          sparse-checkout-cone-mode: false

      - name: Inspect the worker's live row
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ec2-user/app/backend
            echo "server commit: $(cd /home/ec2-user/app && git rev-parse --short HEAD)"
            node scripts/inspect-fro-worker.mjs '${{ inputs.worker }}'
