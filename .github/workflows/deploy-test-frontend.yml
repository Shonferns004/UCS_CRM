name: Deploy Test Frontend (ucs crm)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'ucs crm/**'
      - '.github/workflows/deploy-test-frontend.yml'

jobs:
  deploy-test-frontend:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'ucs crm/package-lock.json'

      - name: Build (test backend)
        env:
          VITE_API_URL: https://test-api.beingsevak.org/api
          VITE_SOCKET_URL: https://test-api.beingsevak.org
          VITE_WHATSAPP_MASTER_EMAIL: ${{ secrets.CRM_WHATSAPP_EMAIL }}
          VITE_WHATSAPP_MASTER_PASSWORD: ${{ secrets.CRM_WHATSAPP_PASSWORD }}
        run: |
          cd "ucs crm"
          npm ci
          npm run build

      - name: Ensure /var/www/crm-test exists
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/crm-test
            sudo chown ec2-user:ec2-user /var/www/crm-test

      - name: Deploy dist to EC2 (/var/www/crm-test)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "ucs crm/dist/*"
          target: /var/www/crm-test
          strip_components: 2

      - name: Caddy site for test-crm.beingsevak.org
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # The server uses Caddy (not nginx); Caddy auto-provisions HTTPS.
            # Idempotent: drop any previously-appended block, then append fresh.
            sudo cp /etc/caddy/Caddyfile /tmp/Caddyfile.bak
            sudo sed -i '/# --- BEGIN test-crm.beingsevak.org ---/,/# --- END test-crm.beingsevak.org ---/d' /etc/caddy/Caddyfile
            sudo tee -a /etc/caddy/Caddyfile >/dev/null <<'CADDY'
            # --- BEGIN test-crm.beingsevak.org ---
            test-crm.beingsevak.org {
                root * /var/www/crm-test
                encode gzip
                try_files {path} /index.html
                file_server
            }
            # --- END test-crm.beingsevak.org ---
            CADDY
            if caddy validate --config /etc/caddy/Caddyfile >/tmp/caddyvalidate.log 2>&1; then
              sudo systemctl reload caddy
              echo "OK: caddy reloaded - test-crm.beingsevak.org -> /var/www/crm-test"
            else
              sudo cp /tmp/Caddyfile.bak /etc/caddy/Caddyfile
              echo "ERROR: caddy config invalid - restored previous Caddyfile"
              cat /tmp/caddyvalidate.log
              exit 1
            fi
