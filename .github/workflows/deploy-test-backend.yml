name: Deploy Test Backend

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-test-backend.yml'

jobs:
  deploy-test-backend:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4

      - name: Deploy test backend to EC2 (port 5001, test schema)
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/app
            git fetch origin
            git reset --hard origin/master
            cd backend
            npm ci
            cd ..

            # Recreate the test backend PM2 process on port 5001 pointing at the
            # test DATABASE_URL (search_path=test clone). The value is read from
            # backend/.env (TEST_DATABASE_URL, managed via env admin) so no
            # GitHub secret is needed. dotenv never overrides an existing process
            # env var, so DATABASE_URL here wins over .env.
            TEST_DB_URL=$(grep '^TEST_DATABASE_URL=' backend/.env | head -1 | cut -d= -f2-)
            if [ -z "$TEST_DB_URL" ]; then
              echo "ERROR: TEST_DATABASE_URL not found in backend/.env"
              exit 1
            fi
            pm2 delete backend-test >/dev/null 2>&1 || true
            PORT=5001 DATABASE_URL="$TEST_DB_URL" \
              pm2 start backend/src/index.js --name backend-test
            pm2 save

            # Caddy site: test-api.beingsevak.org -> 127.0.0.1:5001
            # The server uses Caddy (not nginx); Caddy auto-provisions HTTPS.
            # Idempotent: drop any previously-appended block, then append fresh.
            sudo cp /etc/caddy/Caddyfile /tmp/Caddyfile.bak
            sudo sed -i '/# --- BEGIN test-api.beingsevak.org ---/,/# --- END test-api.beingsevak.org ---/d' /etc/caddy/Caddyfile
            sudo tee -a /etc/caddy/Caddyfile >/dev/null <<'CADDY'
            # --- BEGIN test-api.beingsevak.org ---
            test-api.beingsevak.org {
                reverse_proxy 127.0.0.1:5001
            }
            # --- END test-api.beingsevak.org ---
            CADDY
            if caddy validate --config /etc/caddy/Caddyfile >/tmp/caddyvalidate.log 2>&1; then
              sudo systemctl reload caddy
              echo "OK: caddy reloaded - test-api.beingsevak.org -> 127.0.0.1:5001"
            else
              sudo cp /tmp/Caddyfile.bak /etc/caddy/Caddyfile
              echo "ERROR: caddy config invalid - restored previous Caddyfile"
              cat /tmp/caddyvalidate.log
              exit 1
            fi

            sleep 4
            echo "--- health ---"
            curl -s http://127.0.0.1:5001/api/health || true
            echo ""
            echo "--- pm2 ---"
            pm2 jlist | node -e "const j=JSON.parse(require('fs').readFileSync(0));for(const p of j)console.log(p.name,p.pm2_env.status)" || pm2 list
