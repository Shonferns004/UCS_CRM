name: Diag Caddy

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Inspect Caddy on server
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== caddy version ==="
            caddy version 2>&1 || /usr/bin/caddy version 2>&1 || echo "no caddy in path"
            echo "=== caddyfile ==="
            sudo cat /etc/caddy/Caddyfile 2>&1 || echo "no /etc/caddy/Caddyfile"
            echo "=== /etc/caddy listing ==="
            sudo ls -la /etc/caddy 2>&1
            echo "=== caddy process ==="
            ps aux | grep -i caddy | grep -v grep || echo "no caddy process"
            echo "=== caddy service ==="
            sudo systemctl status caddy --no-pager -l 2>&1 | head -30 || echo "no caddy service"
            echo "=== listening ports ==="
            sudo ss -tlnp 2>&1 | head -20
            echo "=== pm2 ==="
            pm2 list 2>&1
