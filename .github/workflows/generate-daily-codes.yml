name: Generate Daily QR Codes

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily code generation endpoint
        run: |
          curl -X POST https://13-207-47-116.sslip.io/api/cron/generate-daily-codes \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            -f
