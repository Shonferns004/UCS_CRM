name: ucs_admin
description: "UCS Admin — admin console for UCS Attendance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^6.0.11
  intl: ^0.20.2
  google_fonts: ^6.2.1
  http: ^1.2.0
  geolocator: ^13.0.2
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  socket_io_client: ^3.1.6
  printing: ^5.13.4
  pdf: ^3.11.1
  lucide_icons_flutter: ^3.1.15
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:

  uses-material-design: true

  assets:
    - assets/logo/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/splash/splash.png"
  android: true
  ios: false
  android_gravity: center
  fullscreen: true
