name: lockbox
description: "LockBox: block distracting apps, stay focused. Accessibility-driven allowlist app guard with hidden launcher access."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Icons used across the app (matches repo convention).
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true